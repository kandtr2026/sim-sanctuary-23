name: Blog Bot - Daily Draft

on:
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam, 13:00 UTC = 20:00 giờ Việt Nam.
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write-draft:
    runs-on: ubuntu-latest
    env:
      BOT_SUPABASE_URL: ${{ secrets.BOT_SUPABASE_URL }}
      BOT_SUPABASE_APIKEY: ${{ secrets.BOT_SUPABASE_APIKEY }}
      BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
      BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      # Mặc định: TỰ ĐĂNG (published=true) theo OpenCode.md v3. Đặt secret "false" hoặc dùng BOT_DRAFT=true để chỉ tạo nháp.
      BOT_AUTO_PUBLISH: ${{ secrets.BOT_AUTO_PUBLISH }}
      # LLM mặc định = DeepSeek (deepseek-chat). Chỉ cần set LLM_API_KEY.
      # Đổi model: LLM_PROVIDER/LLM_MODEL (vd openai/gpt-4o-mini, anthropic/claude-sonnet-4-5, groq/...).
      # Đổi endpoint khác: LLM_BASE_URL.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write one draft post
        run: node scripts/blog-bot/index.mjs
